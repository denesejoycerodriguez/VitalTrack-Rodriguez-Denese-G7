{% extends "layout_app.html" %}
{% block title %}Edit profile{% endblock %}
{% block content %}
<div class="page-head"><div><h1>Edit profile</h1><p>Update your name, contact details, or photo.</p></div></div>
<div class="panel" style="max-width:640px">
  <form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {% include "includes/form_fields.html" %}
    <div class="d-flex gap-2 mt-3">
      <button type="submit" class="btn btn-primary">Save changes</button>
      <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
