{% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">{% for e in form.non_field_errors %}{{ e }}{% endfor %}</div>
{% endif %}
{% for field in form %}
  <div class="mb-3">
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if not field.field.required %} <span class="field-help">(optional)</span>{% endif %}</label>
    {{ field }}
    {% for e in field.errors %}<div class="invalid-feedback">{{ e }}</div>{% endfor %}
    {% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}
  </div>
{% endfor %}
